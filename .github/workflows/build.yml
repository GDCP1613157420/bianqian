name: Build Windows Executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false

    runs-on: ${{ matrix.os }}
    # Windows is required to build the .exe
    # macOS is used for the frontend build, then artifacts are passed to Windows
    matrix:
      include:
        - os: macos-latest
          platform: darwin
        - os: windows-latest
          platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # ── macOS: build the frontend ──────────────────────────────────────────
      - name: Build frontend (macOS)
        if: matrix.platform == 'darwin'
        run: npm run build
        env:
          CI: true

      # ── Upload frontend artifacts so Windows can use it ────────────────────
      - name: Upload frontend dist
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            dist/
            index.html
          retention-days: 1

      # ── Windows: download frontend and compile .exe ────────────────────────
      - name: Download frontend dist
        if: matrix.platform == 'windows'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Move frontend dist into Tauri project
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p src-tauri
          # tauri.conf.json expects dist at ../dist relative to src-tauri/
          # The checkout puts files at repository root, same as src-tauri/
          # So dist/ is already at the right path (../dist from src-tauri/)

      - name: Setup Rust
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        if: matrix.platform == 'windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri application (Windows)
        if: matrix.platform == 'windows'
        run: |
          npx tauri build
        env:
          CI: true
          # NSIS needs this to not prompt
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload Windows executable
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-sticky-notes-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.msi
            src-tauri/target/release/bundle/nsis/*.msm
          retention-days: 5

      - name: Upload standalone exe
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-sticky-notes-standalone
          path: |
            src-tauri/target/release/桌面便签.exe
            src-tauri/target/release/*.exe
          retention-days: 5

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-sticky-notes-exe
          path: installers

      - name: Download standalone exe
        uses: actions/download-artifact@v4
        with:
          name: desktop-sticky-notes-standalone
          path: standalone

      - name: Create portable zip
        run: |
          mkdir -p release
          cp standalone/*.exe release/ 2>/dev/null || true
          cd installers
          for f in *.exe *.msi; do
            [ -f "$f" ] && cp "$f" ../release/
          done
          cd ..
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
